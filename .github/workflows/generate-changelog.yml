name: Generate Changelog

on:
  workflow_call:
    inputs:
      release_branch:
        description: 'The release branch name'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      release_branch:
        description: 'The release branch name (e.g., release/2.1.0)'
        required: true
        type: string

jobs:
  generate:
    name: Generate changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from branch
        id: version
        run: |
          BRANCH="${{ inputs.release_branch }}"
          if [[ "$BRANCH" == release/* ]]; then
            VERSION="${BRANCH#release/}"
          elif [[ "$BRANCH" == hotfix/* ]]; then
            VERSION="${BRANCH#hotfix/}"
          else
            VERSION=$(grep 'version = ' anr-watchdog/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/' | sed 's/-SNAPSHOT//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Update version in build file
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/version = \".*\"/version = \"$VERSION\"/" anr-watchdog/build.gradle.kts
          echo "Updated build.gradle.kts to version $VERSION"

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Generate changelog content
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          DATE=$(date +%Y-%m-%d)

          echo "## [$VERSION] - $DATE" > /tmp/new_changelog.md
          echo "" >> /tmp/new_changelog.md

          if [ -n "$PREV_TAG" ]; then
            # Get commits since last tag
            echo "### Changes" >> /tmp/new_changelog.md
            echo "" >> /tmp/new_changelog.md

            # Features
            FEATURES=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --grep="^feat" | head -20)
            if [ -n "$FEATURES" ]; then
              echo "#### Features" >> /tmp/new_changelog.md
              echo "$FEATURES" >> /tmp/new_changelog.md
              echo "" >> /tmp/new_changelog.md
            fi

            # Bug fixes
            FIXES=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --grep="^fix" | head -20)
            if [ -n "$FIXES" ]; then
              echo "#### Bug Fixes" >> /tmp/new_changelog.md
              echo "$FIXES" >> /tmp/new_changelog.md
              echo "" >> /tmp/new_changelog.md
            fi

            # Other changes
            OTHER=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --grep="^chore\|^docs\|^refactor\|^build\|^ci" | head -20)
            if [ -n "$OTHER" ]; then
              echo "#### Other Changes" >> /tmp/new_changelog.md
              echo "$OTHER" >> /tmp/new_changelog.md
              echo "" >> /tmp/new_changelog.md
            fi
          else
            echo "### Initial Release" >> /tmp/new_changelog.md
            echo "" >> /tmp/new_changelog.md
            echo "First stable release of ANR-WatchDog v2." >> /tmp/new_changelog.md
            echo "" >> /tmp/new_changelog.md
          fi

          cat /tmp/new_changelog.md

      - name: Update CHANGELOG.md
        run: |
          if [ -f CHANGELOG.md ]; then
            # Insert new changelog after the header
            head -n 2 CHANGELOG.md > /tmp/changelog_header.md
            tail -n +3 CHANGELOG.md > /tmp/changelog_body.md
            cat /tmp/changelog_header.md /tmp/new_changelog.md /tmp/changelog_body.md > CHANGELOG.md
          else
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat /tmp/new_changelog.md >> CHANGELOG.md
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add anr-watchdog/build.gradle.kts CHANGELOG.md
          git commit -m "chore: prepare release v${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push origin ${{ inputs.release_branch }}
