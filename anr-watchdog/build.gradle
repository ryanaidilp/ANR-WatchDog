plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
    id 'signing'
}

group = "com.github.anrwatchdog"
version = "2.0.0"

android {
    namespace 'com.github.anrwatchdog'
    compileSdk 34

    defaultConfig {
        minSdk 16
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.1'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = group
            artifactId = 'anrwatchdog'
            version = project.version

            afterEvaluate {
                from components.release
            }

            pom {
                name = 'ANR-Watchdog'
                description = 'A simple watchdog that detects Android ANR (Application Not Responding) error and throws a meaningful exception'
                url = 'https://github.com/SalomonBrys/ANR-WatchDog'

                licenses {
                    license {
                        name = 'MIT'
                        url = 'http://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'salomonbrys'
                        name = 'Salomon BRYS'
                        email = 'salomon.brys@gmail.com'
                    }
                }

                scm {
                    url = 'https://github.com/SalomonBrys/ANR-WatchDog'
                    connection = 'scm:git:https://github.com/SalomonBrys/ANR-WatchDog.git'
                    developerConnection = 'scm:git:git@github.com:SalomonBrys/ANR-WatchDog.git'
                    tag = 'HEAD'
                }

                issueManagement {
                    system = 'GitHub Issues'
                    url = 'https://github.com/SalomonBrys/ANR-WatchDog/issues'
                }
            }
        }
    }

    repositories {
        maven {
            name = "sonatype"
            def releasesRepoUrl = "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://oss.sonatype.org/content/repositories/snapshots/"
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl

            credentials {
                username = findProperty("ossrhUsername") ?: ""
                password = findProperty("ossrhPassword") ?: ""
            }
        }
    }
}

signing {
    sign publishing.publications.release
}
