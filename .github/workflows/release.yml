name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

  push:
    tags:
      - 'v*'

jobs:
  # Triggered when release/hotfix PR is merged to master
  create-release:
    name: Create Release
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from branch
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ "$BRANCH" == release/* ]]; then
            VERSION="${BRANCH#release/}"
          elif [[ "$BRANCH" == hotfix/* ]]; then
            VERSION="${BRANCH#hotfix/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  # Triggered when tag is pushed (either manually or by create-release job)
  build-and-publish:
    name: Build and Publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :anr-watchdog:testDebugUnitTest

      - name: Build release AAR
        run: ./gradlew :anr-watchdog:assembleRelease

      - name: Build release sources JAR
        run: ./gradlew :anr-watchdog:androidSourcesJar || true

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## ANR-WatchDog ${{ github.ref_name }}

            ### Installation

            **JitPack (Recommended)**
            ```groovy
            // In settings.gradle.kts
            dependencyResolutionManagement {
                repositories {
                    maven { url = uri("https://jitpack.io") }
                }
            }

            // In app/build.gradle.kts
            dependencies {
                implementation("com.github.ryanaidilp:ANR-WatchDog:${{ github.ref_name }}")
            }
            ```

            See [CHANGELOG.md](https://github.com/ryanaidilp/ANR-WatchDog/blob/master/CHANGELOG.md) for details.
          files: |
            anr-watchdog/build/outputs/aar/anr-watchdog-release.aar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger JitPack build
        run: |
          curl -s "https://jitpack.io/api/builds/com.github.ryanaidilp/ANR-WatchDog/${{ github.ref_name }}" || true

  # Trigger back-merge after release is created
  trigger-back-merge:
    name: Trigger Back-merge
    needs: create-release
    if: needs.create-release.outputs.version != ''
    uses: ./.github/workflows/back-merge.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit

  # Delete merged release/hotfix branch
  cleanup:
    name: Cleanup Branch
    needs: create-release
    if: needs.create-release.outputs.version != ''
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" || true
