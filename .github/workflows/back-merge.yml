name: Back Merge

on:
  workflow_call:
    inputs:
      version:
        description: 'The version that was released'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: 'The version to back-merge (e.g., 2.1.0)'
        required: true
        type: string

jobs:
  back-merge:
    name: Back-merge to develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create back-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"

          # Check if develop branch exists
          if ! git ls-remote --heads origin develop | grep -q develop; then
            echo "Develop branch does not exist, skipping back-merge"
            exit 0
          fi

          # Create a branch for the back-merge
          MERGE_BRANCH="back-merge/v$VERSION"
          git checkout -b "$MERGE_BRANCH"
          git push origin "$MERGE_BRANCH"

          # Create PR
          gh pr create \
            --base develop \
            --head "$MERGE_BRANCH" \
            --title "chore: back-merge v$VERSION to develop" \
            --body "## Back-merge Release v$VERSION

            This PR merges the release changes from master back to develop.

            ### What's included
            - All changes from v$VERSION release
            - Any hotfixes applied to master

            ### Note
            If there are conflicts, resolve them carefully to ensure develop has all the latest changes.

            ---
            _Auto-generated by release workflow_"
