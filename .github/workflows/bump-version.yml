name: Bump Version

on:
  workflow_call:
    inputs:
      release_branch:
        description: 'The release branch name'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump-develop:
    name: Bump develop to next version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep 'version = ' anr-watchdog/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate next version
        id: next_version
        run: |
          CURRENT="${{ steps.current_version.outputs.current }}"

          # Parse version components
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3 | sed 's/-.*//')

          # Bump minor version for next development
          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="$MAJOR.$NEXT_MINOR.0-SNAPSHOT"

          echo "next=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Next development version: $NEXT_VERSION"

      - name: Update version in develop
        run: |
          NEXT_VERSION="${{ steps.next_version.outputs.next }}"

          # Update version in build.gradle.kts
          sed -i "s/version = \".*\"/version = \"$NEXT_VERSION\"/" anr-watchdog/build.gradle.kts

          echo "Updated version to $NEXT_VERSION"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add anr-watchdog/build.gradle.kts
          git commit -m "chore: bump version to ${{ steps.next_version.outputs.next }} for next development"
          git push origin develop
