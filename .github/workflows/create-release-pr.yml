name: Create Release PR

on:
  create:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create PR to master
    # Only run for release/* or hotfix/* branches (create event doesn't support branches filter)
    if: |
      github.event.ref_type == 'branch' &&
      (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get branch info
        id: branch_info
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          if [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION="${BRANCH_NAME#release/}"
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == hotfix/* ]]; then
            VERSION="${BRANCH_NAME#hotfix/}"
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if PR already exists
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          EXISTING_PR=$(gh pr list --base master --head "$BRANCH_NAME" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ PR #$EXISTING_PR already exists for $BRANCH_NAME"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR to master
        if: steps.check_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          VERSION="${{ steps.branch_info.outputs.version }}"

          if [[ "${{ steps.branch_info.outputs.is_release }}" == "true" ]]; then
            TITLE="release: v$VERSION"
            BODY="## Release v$VERSION

            This PR prepares the release of version $VERSION.

            ### Checklist
            - [ ] Version bumped in build.gradle.kts
            - [ ] CHANGELOG.md updated
            - [ ] All tests passing
            - [ ] Documentation updated

            ### After Merge
            - A GitHub release will be created automatically
            - JitPack will be triggered to build the new version
            - Changes will be back-merged to develop"
          else
            TITLE="hotfix: v$VERSION"
            BODY="## Hotfix v$VERSION

            This PR contains hotfix changes for version $VERSION.

            ### Changes
            _Describe the hotfix changes here_

            ### After Merge
            - A GitHub release will be created automatically
            - JitPack will be triggered to build the new version
            - Changes will be back-merged to develop"
          fi

          gh pr create \
            --base master \
            --head "$BRANCH_NAME" \
            --title "$TITLE" \
            --body "$BODY"

  trigger-bump-version:
    name: Trigger version bump
    needs: create-pr
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/bump-version.yml
    with:
      release_branch: ${{ github.ref_name }}
    secrets: inherit

  trigger-changelog:
    name: Trigger changelog generation
    needs: create-pr
    uses: ./.github/workflows/generate-changelog.yml
    with:
      release_branch: ${{ github.ref_name }}
    secrets: inherit
